  <line x1="103" y1="15" x2="103" y2="32" stroke="#cbd5e1"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600">
