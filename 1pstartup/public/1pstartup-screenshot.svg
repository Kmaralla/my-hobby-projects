  <rect x="1102" y="11" width="123" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="1115" y="27" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">+ connect project</text>
  <rect x="1235" y="11" width="29" height="24" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="1244" y="27" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">✏️</text>

  <g text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
